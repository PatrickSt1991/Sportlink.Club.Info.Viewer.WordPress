name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (7.4 and 8.3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './vue-app/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  vue-app:
    name: Front-end tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Committed bundle must match the source
        working-directory: .
        run: |
          if ! git diff --quiet -- assets/dist; then
            echo "::error::assets/dist is out of date. Run 'npm run build' in vue-app and commit the result."
            git --no-pager diff --stat -- assets/dist
            exit 1
          fi
